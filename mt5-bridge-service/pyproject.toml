[project]
name = "ykp-mt5-bridge"
version = "0.1.0"
description = "Windows-native FastAPI bridge between YKP orchestrator and MetaTrader5 terminal"
requires-python = ">=3.11"
dependencies = [
  "MetaTrader5>=5.0.5735",
  "fastapi==0.115.0",
  "uvicorn[standard]==0.32.0",
  "pydantic==2.9.0",
  "python-dotenv==1.0.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mt5_bridge*"]